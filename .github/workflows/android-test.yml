````yaml
name: Build and Test Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4android.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.mostafa.silentraid
            adb shell monkey -p com.mostafa.silentraid 1
            sleep 10
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            adb shell screencap -p /sdcard/silentraid.png
            adb pull /sdcard/silentraid.png ./silentraid-emulator.png

      - name: Upload emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: silentraid-emulator-test
          path: silentraid-emulator.png
:::

### 3. اضغط

**Commit changes → Commit directly to the `main` branch**

ولا تغير أي شيء آخر.

