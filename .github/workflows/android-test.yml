## 4. شغّل الاختبار

اذهب إلى:

[Actions في Silent-Raid](https://github.com/mostafahammad480-rgb/Silent-Raid/actions?utm_source=chatgpt.com)

ستجد:

**Build and Test Android**

اضغط عليه ثم:

**Run workflow → Run workflow**

وانتظر.

### 5. ماذا سيحدث؟

GitHub سيعمل الآتي تلقائيًا:

**يبني APK → يشغل Android Emulator → يثبت اللعبة → يفتحها → ينتظر 10 ثوانٍ → يأخذ Screenshot → يرفعه كـ Artifact.**

يعني **لن تحتاج تثبيت APK على هاتفك لكي نعرف هل التطبيق يفتح أصلًا أم لا.**

إذا ظهرت علامة **✅ خضراء**، افتح الـRun وانزل إلى:

**Artifacts**

ستجد:

```text
silentraid-emulator-test
````

داخله Screenshot من اللعبة وهي تعمل على Android Emulator.

إذا ظهرت علامة **❌ حمراء**، **لا تحمل أي APK**. انسخ لي فقط الخطأ الموجود في الـRun، وأنا أصلح المشكلة من هناك.

### نقطة مهمة جدًا

هذا الاختبار الأول **لا يختبر الـZoom بصريًا بشكل كامل بعد**؛ هو أولًا يمنع كارثة *"نزّلت APK وبعدها اكتشفت أنها لا تفتح"*. بعد أن ينجح، نضيف خطوة اختبار Screenshot للـGameplay نفسه ونفحص **Full Screen + الحواف + Zoom** قبل أن أعطيك APK جديدًا.

هذا هو الطريق الصحيح الآن.
